# 仅验证训练链路，示例数据不能用于评估领域效果。
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
stage: pt
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false

dataset_dir: ./data
dataset: risk_cpt_demo_train
eval_dataset: risk_cpt_demo_valid
template: qwen3_vl_nothink
cutoff_len: 2048
packing: false
preprocessing_num_workers: 2

output_dir: ./outputs/qwen3vl4b-risk-cpt-smoke
overwrite_output_dir: false
logging_steps: 1
save_steps: 10
save_total_limit: 2
eval_strategy: steps
eval_steps: 10
report_to: none

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
max_steps: 20
lr_scheduler_type: cosine
warmup_steps: 2
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
seed: 42
